<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=794, initial-scale=1.0">
<title>Refúgio Mata Atlântica - Documento Técnico</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 794px; height: 1123px; overflow: hidden; background: #FAF6EE; font-family: 'Inter', sans-serif; }
  
  /* Layer 0 - Base */
  .cover-page { position: relative; width: 794px; height: 1123px; }
  
  /* Layer 1 - Background grid */
  .cover-bg-layer { position: absolute; inset: 0; overflow: hidden; z-index: 1; }
  .grid-pattern {
    width: 100%; height: 100%;
    background-image:
      linear-gradient(rgba(27,94,59,0.02) 0.5px, transparent 0.5px),
      linear-gradient(90deg, rgba(27,94,59,0.02) 0.5px, transparent 0.5px);
    background-size: 50px 50px;
  }
  
  /* Decorative leaf shapes */
  .leaf-deco-1 {
    position: absolute; top: 60px; right: 80px; width: 180px; height: 180px;
    border: 1.5px solid rgba(27,94,59,0.08); border-radius: 50% 0 50% 0;
    transform: rotate(15deg);
  }
  .leaf-deco-2 {
    position: absolute; bottom: 120px; right: 60px; width: 120px; height: 120px;
    border: 1px solid rgba(196,132,29,0.1); border-radius: 0 50% 0 50%;
    transform: rotate(-20deg);
  }
  .leaf-deco-3 {
    position: absolute; top: 380px; right: 200px; width: 60px; height: 60px;
    border: 1px solid rgba(27,94,59,0.06); border-radius: 50%;
  }
  
  /* Layer 2 - Structure */
  .cover-layer-2 { position: absolute; inset: 0; z-index: 2; }
  .anchor-line {
    position: absolute;
    left: 95px;
    top: 112px;
    bottom: 112px;
    width: 5px;
    background: #1B5E3B;
  }
  
  /* Layer 3 - Content */
  .cover-layer-3 { position: absolute; inset: 0; z-index: 3; }
  
  .kicker {
    position: absolute;
    top: 168px;
    left: 145px;
    font-family: 'Inter', sans-serif;
    font-size: 11pt;
    font-weight: 500;
    letter-spacing: 4pt;
    color: #1B5E3B;
    opacity: 0.55;
    text-transform: uppercase;
  }
  
  .hero-title {
    position: absolute;
    top: 300px;
    left: 145px;
    max-width: 520px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 48pt;
    font-weight: 700;
    line-height: 1.12;
    color: #1A1A1A;
  }
  
  .subtitle {
    position: absolute;
    top: 460px;
    left: 145px;
    max-width: 480px;
    font-family: 'Inter', sans-serif;
    font-size: 17pt;
    font-weight: 400;
    line-height: 1.5;
    color: #1A1A1A;
    opacity: 0.78;
  }
  
  .summary {
    position: absolute;
    top: 545px;
    left: 145px;
    max-width: 470px;
    font-family: 'Inter', sans-serif;
    font-size: 11pt;
    font-weight: 300;
    line-height: 1.7;
    color: #1A1A1A;
    opacity: 0.6;
  }
  
  .meta {
    position: absolute;
    top: 835px;
    left: 145px;
    font-family: 'Inter', sans-serif;
    font-size: 11pt;
    font-weight: 400;
    color: #1A1A1A;
    opacity: 0.7;
  }
  
  .meta-line {
    margin-bottom: 6px;
  }
  
  .accent-bar {
    position: absolute;
    top: 788px;
    left: 145px;
    width: 40px;
    height: 3px;
    background: #C4841D;
    border-radius: 2px;
  }
  
  .bottom-tag {
    position: absolute;
    bottom: 50px;
    left: 145px;
    font-family: 'Inter', sans-serif;
    font-size: 8pt;
    font-weight: 400;
    letter-spacing: 2pt;
    color: #1A1A1A;
    opacity: 0.3;
    text-transform: uppercase;
  }
  
  /* Small geometric accent */
  .geo-accent {
    position: absolute;
    top: 180px;
    left: 130px;
    width: 8px;
    height: 8px;
    background: #C4841D;
    border-radius: 50%;
    opacity: 0.6;
  }
</style>
</head>
<body>
<div class="cover-page">
  <!-- Layer 1: Background -->
  <div class="cover-bg-layer">
    <div class="grid-pattern"></div>
    <div class="leaf-deco-1"></div>
    <div class="leaf-deco-2"></div>
    <div class="leaf-deco-3"></div>
  </div>
  
  <!-- Layer 2: Structure -->
  <div class="cover-layer-2">
    <div class="anchor-line"></div>
  </div>
  
  <!-- Layer 3: Content -->
  <div class="cover-layer-3">
    <div class="geo-accent"></div>
    <div class="kicker">Documento Técnico do Projeto</div>
    <div class="hero-title">Refúgio<br>Mata Atlântica</div>
    <div class="subtitle">Website &amp; Sistema de Gestão para Pousadas</div>
    <div class="summary">Template whitelabel completo com Next.js 16, GSAP, Lenis Smooth Scroll, CMS Admin, reservas com Mercado Pago e compliance LGPD.</div>
    <div class="accent-bar"></div>
    <div class="meta">
      <div class="meta-line">Versão 1.0.0</div>
      <div class="meta-line">Julho 2025</div>
    </div>
    <div class="bottom-tag">Eco-Lodge Digital Platform</div>
  </div>
</div>
</body>
</html>
